apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: shadow
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93049/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
spec:
  selector:
    app: aceest-fitness
    track: shadow
  ports:
    - port: 80
      targetPort: 5000
