apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-proxy-config
data:
  nginx.conf: |
    events {}
    http {
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;
      map $http_x_variant $backend {
        default   "http://aceest-canary-stable-service.default.svc.cluster.local";
      }
      server {
        listen 80;
        location / {
          proxy_pass $backend;
          proxy_set_header Host $host;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ab-proxy
  template:
    metadata:
      labels:
        app: ab-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: ab-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-proxy-service
spec:
  selector:
    app: ab-proxy
  ports:
    - port: 80
      targetPort: 80
