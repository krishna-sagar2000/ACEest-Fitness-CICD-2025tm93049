apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary-stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary-stable
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93049/aceest-fitness:v3.1.2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-stable-service
spec:
  selector:
    app: aceest-fitness
    track: canary-stable
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary-new
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary-new
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93049/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-new-service
spec:
  selector:
    app: aceest-fitness
    track: canary-new
  ports:
    - port: 80
      targetPort: 5000
