apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bg-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: bg.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-bg-service
                port:
                  number: 80
