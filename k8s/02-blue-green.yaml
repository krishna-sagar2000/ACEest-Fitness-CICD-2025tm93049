apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      track: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: blue
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93049/aceest-fitness:v2.0.1
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      track: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: green
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93049/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-service
spec:
  selector:
    app: aceest-fitness
    track: blue
  ports:
    - port: 80
      targetPort: 5000
